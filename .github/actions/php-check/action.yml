name: PHP Checks
description: Run all code quality related checks

runs:
  using: composite
  steps:
    - name: Run style check
      shell: bash
      run: |
        vendor/bin/php-cs-fixer check src
        vendor/bin/php-cs-fixer check tests
    - name: Run code check
      shell: bash
      run: vendor/bin/rector process src tests --dry-run
    - name: Run composer.json normalization check
      shell: bash
      run: composer normalize --dry-run
    - name: Run composer.json validation check
      shell: bash
      run: composer validate
    - name: Run dependency analyser
      shell: bash
      run: vendor/bin/composer-dependency-analyser
    - name: Run dependencies audit
      shell: bash
      run: composer audit
#    - name: Run mess detection
#      shell: bash
#      run: phpmd src,tests text phpmd.xml
    - name: Run static analysis
      shell: bash
      run: vendor/bin/phpstan
    - name: Run phpunit tests
      shell: bash
      run: vendor/bin/phpunit --coverage-clover coverage.xml
